  }
} catch(e) { console.error("Firebase error:", e); }

const appStorage = {
  get: async (key) => {
    if (db) {
      try { const s = await db.collection('app_data').doc(key).get(); return s.exists ? {value: s.data().value} : null; }
      catch(e) { console.error(e); return null; }
    }
    try { const v = localStorage.getItem('inedisav_'+key); return v ? {value:v} : null; } catch { return null; }
  },
  set: async (key, val) => {
    if (db) {
      try { await db.collection('app_data').doc(key).set({value: val}); return {key,value:val}; }
      catch(e) { console.error(e); return null; }
    }
    try { localStorage.setItem('inedisav_'+key, val); return {key,value:val}; } catch { return null; }
  }
};

function genPin(s){
  const letra=(s.NOMBRE1||"").trim().charAt(0).toUpperCase();
  const apellido=(s.APELLIDO1||"").trim().toUpperCase().replace(/[^A-ZÑ]/g,"");
  const doc=(s.NRO_DOCUMENTO||"").replace(/\D/g,"");
  if(!letra||!apellido||doc.length<4)return "";
  return `${letra}${apellido}${doc.slice(-4)}e`;
}
function emptyStudent(){const o={};FIELD_DEFS.forEach(f=>{o[f.id]="";});o._id=null;o.ESTADO="MATRICULADO";return o;}
function riskCount(s){if(s.ESTADO==="RETIRADO")return -1;return RISK_FIELDS.filter(f=>s[f]==="S").length;}
function normalizeKey(k){return String(k||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toUpperCase().replace(/\(.*?\)/g,"").replace(/ALT\s*\+?\s*124/g,"").replace(/[¿?]/g,"").replace(/[^A-Z0-9]+/g,"_").replace(/_+/g,"_").replace(/^_|_$/g,"");}
function matchOption(raw,options){
  if(!raw)return raw;
  const norm=s=>String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toUpperCase().replace(/[^A-Z0-9]+/g,"_").replace(/^_|_$/g,"");
  const target=norm(raw);
  const hit=options.find(o=>norm(o.value)===target||norm(o.label)===target);
  return hit?hit.value:raw;
}
const FIELD_KEY_MAP={};FIELD_DEFS.forEach(f=>{FIELD_KEY_MAP[normalizeKey(f.id)]=f.id;});
function countBy(arr,fid){const c={};arr.forEach(s=>{const v=s[fid];if(v)c[v]=(c[v]||0)+1;});return Object.entries(c).map(([name,total])=>({name,total}));}
function countMulti(arr,fids){const c={};arr.forEach(s=>{fids.forEach(f=>{(s[f]||"").split("|").filter(Boolean).forEach(v=>{c[v]=(c[v]||0)+1;});});});return Object.entries(c).map(([name,total])=>({name,total})).sort((a,b)=>b.total-a.total);}
function matchVal(opts,raw){if(!raw)return "";const tries=[raw,String(raw).padStart(2,"0"),String(raw).replace(/^0+/,"")];for(const t of tries){const f=opts.find(o=>(typeof o==="object"?o.value:o)===t);if(f)return typeof f==="object"?f.value:f;}const m=matchOption(raw,opts.map(o=>typeof o==="object"?o:{value:o,label:o}));if(m!==raw)return m;return raw;}
function resolveLabel(field,value){
  if(!value)return "—";
  if(field.type==="yesno")return value==="S"?"Sí":value==="N"?"No":value;
  if(field.type==="date"){try{return new Date(value+"T00:00:00").toLocaleDateString("es-CO");}catch{return value;}}
  const strip=l=>l&&l.includes(" - ")?l.split(" - ").slice(1).join(" - "):(l||value);
  if(field.type==="multicheck"){return (value||"").split("|").filter(Boolean).map(v=>{const tries=[v,String(v).padStart(2,"0"),String(v).replace(/^0+/,"")];let o;for(const t of tries){o=(field.options||[]).find(x=>(typeof x==="object"?x.value:x)===t);if(o)break;}if(!o)o=(field.options||[]).find(x=>(typeof x==="object"?x.label:x)===v);return strip(o?(typeof o==="object"?o.label:o):v);}).join(", ")||"—";}
  if(field.type==="select"){const opts=field.options||[];const tries=[value,String(value).padStart(2,"0"),String(value).replace(/^0+/,"")];let o;for(const t of tries){o=opts.find(x=>(typeof x==="object"?x.value:x)===t);if(o)break;}if(!o)o=opts.find(x=>(typeof x==="object"?x.label:x)===value);if(!o){const mv=matchOption(value,opts.map(x=>typeof x==="object"?x:{value:x,label:x}));o=opts.find(x=>(typeof x==="object"?x.value:x)===mv);}return strip(o?(typeof o==="object"?o.label:o):value);}
  return value;
}

function dlHtml(html,name){const blob=new Blob([html],{type:"text/html;charset=utf-8"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();document.body.removeChild(a);setTimeout(()=>URL.revokeObjectURL(url),2000);}

    if(sec.id==="desercion"&&s.ESTADO!=="RETIRADO")return "";

function FieldRenderer({field,value,onChange,parentValue,disabled}){
  const wide=field.type==="textarea"||field.type==="multicheck";
  const ic="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400 bg-white";
  const ro=opts=>opts.map(o=>{const v=typeof o==="object"?o.value:o;const l=typeof o==="object"?o.label:o;return h('option',{key:v,value:v},l);});

  if(disabled){
    return h('div',{className:wide?"md:col-span-2":""},
      h('label',{className:"block text-xs font-medium text-slate-500 mb-1"},field.label),
      h('div',{className:"w-full border border-slate-200 rounded-lg px-3 py-2 text-sm bg-slate-50 text-slate-600 flex items-center justify-between"},
        h('span',null,resolveLabel(field,value)||"—"),
        h('span',{className:"flex items-center gap-1 text-xs text-amber-600"},h(Icons.Lock),h('span',null,"Restringido"))
      )
    );
  }

  let input;
  function filterVal(v){
    if(field.validate==="alpha")return v.replace(/[^A-Za-zÁÉÍÓÚÑÜáéíóúñü\s]/g,"");
    if(field.validate==="alnum")return v.replace(/[^A-Za-z0-9]/g,"").toUpperCase();
    if(field.validate==="numeric")return v.replace(/[^0-9]/g,"");
    return v;
  }
  if(field.type==="text") input=h('input',{type:"text",value:value||"",onChange:e=>onChange(filterVal(e.target.value)),className:ic});
  else if(field.type==="number") input=h('input',{type:"text",inputMode:"numeric",value:value||"",onChange:e=>onChange(filterVal(e.target.value.replace(/[^0-9]/g,""))),className:ic});
  else if(field.type==="date") input=h('input',{type:"date",value:value||"",onChange:e=>onChange(e.target.value),className:ic});
  else if(field.type==="textarea") input=h('textarea',{value:value||"",onChange:e=>onChange(filterVal(e.target.value)),rows:3,className:ic});
  else if(field.type==="select"){const nv=matchVal(field.options||[],value);input=h('select',{value:nv,onChange:e=>onChange(e.target.value),className:ic},h('option',{value:""},"Seleccionar..."),ro(field.options||[]));}
  else if(field.type==="yesno") input=h('select',{value:value||"",onChange:e=>onChange(e.target.value),className:ic},h('option',{value:""},"Seleccionar..."),h('option',{value:"S"},"Sí"),h('option',{value:"N"},"No"));
  else if(field.type==="dependent_select"){

function StudentSelfView({studentId,onLogout}){
  const [data,setData]=useState(null);
  const [saving,setSaving]=useState(false);
  const [saved,setSaved]=useState(false);
  const [error,setError]=useState("");
  const [activeSection,setActiveSection]=useState(0);

  useEffect(()=>{
    if(!studentsCol){setError("Base de datos no disponible.");return;}
    const unsub=studentsCol.doc(studentId).onSnapshot(snap=>{
      if(snap.exists)setData({...snap.data(),_id:snap.id});
      else setError("Tu registro ya no está disponible. Contacta a la institución.");
    },err=>{console.error(err);setError("Error de conexión.");});
    return ()=>unsub();
  },[studentId]);

  function hChange(fid,val){setData(p=>({...p,[fid]:val}));}

  async function save(){
    if(!data)return;
    setSaving(true);setError("");
    try{
      // Solo actualiza los campos que el estudiante puede editar; nunca toca identificación, ESTADO ni PIN.
      const editable={};
      FIELD_DEFS.forEach(f=>{if(!f.studentLocked&&!f.adminOnly)editable[f.id]=data[f.id]??"";});
      await studentsCol.doc(studentId).update(editable);
      setSaved(true);setTimeout(()=>setSaved(false),3000);
    }catch(e){console.error(e);setError("No se pudo guardar. Intenta de nuevo.");}
    finally{setSaving(false);}
  }

  if(error&&!data)return h('div',{className:"min-h-screen bg-slate-50 flex items-center justify-center px-4"},
    h('div',{className:"bg-white rounded-2xl shadow p-6 max-w-sm text-center"},

      h('button',{onClick:onLogout,className:"px-4 py-2 bg-indigo-600 text-white rounded-lg text-sm"},"Volver al login")

  );
  if(!data)return h('div',{className:"min-h-screen flex items-center justify-center text-slate-400 text-sm"},"Cargando tu información...");

  const nombre=[data.NOMBRE1,data.NOMBRE2,data.APELLIDO1,data.APELLIDO2].filter(Boolean).join(" ");

  return h('div',{className:"min-h-screen bg-slate-50 text-slate-800"},
    h('header',{className:"bg-gradient-to-r from-indigo-600 to-blue-600 text-white px-4 sm:px-6 py-4 shadow-md"},
      h('div',{className:"max-w-3xl mx-auto flex items-center justify-between flex-wrap gap-3"},
        h('div',null,
          h('h1',{className:"text-lg font-semibold"},"Mi información - "+II.nombre),
          h('p',{className:"text-xs text-white/80 mt-0.5"},nombre)
        ),
        h('button',{onClick:onLogout,className:"px-3 py-1.5 rounded-lg text-sm font-medium bg-white/10 hover:bg-white/20 border border-white/30"},"Salir")
      )
    ),
    h('main',{className:"max-w-3xl mx-auto px-4 py-6 space-y-4"},
      h('div',{className:"bg-amber-50 border border-amber-200 text-amber-700 text-sm rounded-lg px-4 py-3"},
        "Actualiza tu información cada año. Tu nombre, documento y tipo de documento no se pueden modificar aquí; si hay un error en esos datos, contacta a la institución."
      ),
      h('div',{className:"flex gap-1 flex-wrap"},STUDENT_SECTIONS.map((sec,i)=>h('button',{key:sec.id,onClick:()=>setActiveSection(i),className:`px-3 py-1.5 rounded-full text-sm whitespace-nowrap ${activeSection===i?"bg-indigo-600 text-white":"bg-slate-100 text-slate-600 hover:bg-slate-200"}`},sec.label))),
      h('div',{className:"bg-sky-50 border border-sky-200 text-sky-700 text-xs rounded-lg px-4 py-2.5 flex items-start gap-2"},
        h(Icons.Info),
        h('span',null,
          STUDENT_SECTIONS[activeSection].id==="familiar"
            ?h('span',null,h('strong',null,"Esta sección la debe llenar el acudiente responsable. "),"La información de este apartado corresponde a la persona a cargo del estudiante, no al estudiante mismo.")
            :h('span',null,h('strong',null,"Esta sección corresponde únicamente al estudiante"),nombre?` (${nombre})`:"",". No registres aquí datos del acudiente o de otra persona.")
        )
      ),
      h('div',{className:"bg-white rounded-xl border border-slate-200 p-5"},
        h('div',{className:"grid grid-cols-1 md:grid-cols-2 gap-4"},
          FIELD_DEFS.filter(f=>f.section===STUDENT_SECTIONS[activeSection].id&&!f.hidden&&!f.adminOnly).map(f=>
            h(FieldRenderer,{key:f.id,field:f,value:data[f.id],onChange:v=>hChange(f.id,v),parentValue:f.dependsOn?data[f.dependsOn]:undefined,disabled:!!f.studentLocked})
          )
        )
      ),
      error&&h('div',{className:"bg-rose-50 text-rose-600 text-xs px-3 py-2 rounded-lg"},error),
      saved&&h('div',{className:"bg-emerald-50 text-emerald-700 text-sm px-4 py-3 rounded-lg flex items-center justify-between flex-wrap gap-2"},
        h('span',null,"✓ Tu información fue actualizada."),
        h('button',{onClick:()=>printCard(data),className:"flex items-center gap-1.5 px-3 py-1.5 bg-emerald-600 text-white rounded-lg text-xs hover:bg-emerald-700"},h(Icons.Print),"Ver / descargar mi ficha")
      ),
      h('div',{className:"flex justify-between flex-wrap gap-3"},
        h('div',{className:"flex gap-2"},
          h('button',{disabled:activeSection===0,onClick:()=>setActiveSection(s=>s-1),className:"flex items-center gap-1 px-3 py-2 border rounded-lg text-sm disabled:opacity-40"},h(Icons.ChevL),"Anterior"),
          h('button',{disabled:activeSection===STUDENT_SECTIONS.length-1,onClick:()=>setActiveSection(s=>s+1),className:"flex items-center gap-1 px-3 py-2 border rounded-lg text-sm disabled:opacity-40"},"Siguiente",h(Icons.ChevR))
        ),

          h('button',{disabled:saving,onClick:save,className:"flex items-center gap-1.5 px-4 py-2 bg-indigo-600 text-white rounded-lg text-sm hover:bg-indigo-700 disabled:opacity-60"},h(Icons.Save),saving?"Guardando...":"Guardar mi información")
        )
      )
    )
  );
}

function App(){
  const [session,setSession]=useState(null);
  const [students,setStudents]=useState([]);
  const [loading,setLoading]=useState(true);
  const [view,setView]=useState("list");
  const [search,setSearch]=useState("");
  const [filterAnio,setFilterAnio]=useState("");
  const [filterGrado,setFilterGrado]=useState("");
  const [filterGrupo,setFilterGrupo]=useState("");
  const [filterJornada,setFilterJornada]=useState("");
  const [filterRiesgo,setFilterRiesgo]=useState("");
  const [filterFactor,setFilterFactor]=useState("");
  const [filterEstado,setFilterEstado]=useState("");
  const [page,setPage]=useState(1);
  const [editingId,setEditingId]=useState(null);
  const [formData,setFormData]=useState(emptyStudent());
  const [activeSection,setActiveSection]=useState(0);
  const [statusMsg,setStatusMsg]=useState("");
  const [statusError,setStatusError]=useState(false);
  const [importing,setImporting]=useState(false);
  const [confirmDeleteId,setConfirmDeleteId]=useState(null);
  const [viewingStudent,setViewingStudent]=useState(null);
  const [showSettings,setShowSettings]=useState(false);
  const [showInstConfig,setShowInstConfig]=useState(false);
  const [instVersion,setInstVersion]=useState(0);
  const [showSimpadeMenu,setShowSimpadeMenu]=useState(false);
  const [confirmClearDB,setConfirmClearDB]=useState(false);
  const [importResult,setImportResult]=useState(null);
  const fileRef=useRef(null);
  const stRef=useRef(null);
  const PAGE=10;

  useEffect(()=>{loadInstConfig().then(()=>setInstVersion(v=>v+1));},[]);

  useEffect(()=>{
    if(studentsCol){
      // Listener en tiempo real: cualquier cambio de cualquier usuario se refleja al instante, sin recargar.
      const unsub=studentsCol.onSnapshot(snap=>{
        const list=snap.docs.map(d=>({...d.data(),_id:d.id}));
        setStudents(list);
        setLoading(false);
      },err=>{console.error(err);showSt("Error de sincronización con la base de datos.",true);setLoading(false);});
      return ()=>unsub();
    } else {
      // Sin Firebase: fallback a localStorage (modo offline, un solo navegador)
      (async()=>{try{if(appStorage){const r=await appStorage.get("students-data");if(r?.value)setStudents(JSON.parse(r.value));}}catch{}finally{setLoading(false);}})();
    }
  },[]);

  if(!session)return h(LoginScreen,{onLogin:setSession});
  const role=session.role;
  if(role==="estudiante")return h(StudentSelfView,{studentId:session.studentId,onLogout:()=>setSession(null)});
  const isAdmin=role==="admin";
  const canManageUsers=role==="admin"||role==="rector";
  const canManageEstado=["admin","rector","coordinacion","orientacion"].includes(role);
  const canDelete=["admin","coordinacion"].includes(role);
  const canIE=role==="admin";
  const canEditStudents=["admin","auxiliar","coordinacion"].includes(role);

  function showSt(msg,isError=false){setStatusMsg(msg);setStatusError(isError);if(stRef.current)clearTimeout(stRef.current);stRef.current=setTimeout(()=>setStatusMsg(""),4000);}
  async function persist(list){try{await appStorage.set("students-data",JSON.stringify(list));}catch(e){console.error(e);}} // solo fallback localStorage
  function hChange(fid,val){setFormData(p=>{const n={...p,[fid]:val};if(fid==="RAZON_DESERCION")n.CAUSAS="";if(fid==="ESTADO"&&val!=="RETIRADO"){n.RAZON_DESERCION="";n.CAUSAS="";n.ES_LA_RAZON="";n.FECHA_RETIRO="";n.RAZON_DESERCION_OTRAS="";}return n;});}
  function startNew(){setFormData(emptyStudent());setEditingId(null);setActiveSection(0);setView("form");}
  function startEdit(s){setFormData(s);setEditingId(s._id);setActiveSection(0);setView("form");}
  async function hSave(){
    if(!canEditStudents){showSt("Tu rol solo tiene permiso de lectura.",true);return;}
    const id=editingId||`${Date.now()}_${Math.random().toString(36).slice(2)}`;
    if(!formData.PIN){const auto=genPin(formData);if(auto)formData.PIN=auto;}
    const data={...formData,_id:id};
    try{
      if(studentsCol){
        await studentsCol.doc(id).set(data); // escribe SOLO este estudiante; no toca a los demás
      }else{
        const list=editingId?students.map(s=>s._id===id?data:s):[...students,data];
        setStudents(list);await persist(list);
      }
      showSt(editingId?"Estudiante actualizado correctamente.":"Estudiante guardado correctamente.");
      if(data.ESTADO==="RETIRADO"&&(!data.RAZON_DESERCION||!data.CAUSAS)){
        setEditingId(id);
        setActiveSection(SECTIONS.findIndex(s=>s.id==="desercion"));
      }else{
        setView("list");
      }
    }catch(e){console.error(e);showSt("No se pudo guardar. Verifica tu conexión e inténtalo de nuevo.",true);}
  }
  async function hDelete(id){
    if(!canDelete){showSt("Tu rol no tiene permiso para eliminar estudiantes.",true);return;}
    try{
      if(studentsCol){
        await studentsCol.doc(id).delete();
      }else{
        const list=students.filter(s=>s._id!==id);setStudents(list);await persist(list);
      }
      setConfirmDeleteId(null);
      showSt("Estudiante eliminado.");
    }catch(e){console.error(e);showSt("No se pudo eliminar. Inténtalo de nuevo.",true);}
  }
  async function hClear(){
    try{
      if(studentsCol){
        const snap=await studentsCol.get();
        let batch=db.batch();let n=0;
        for(const doc of snap.docs){batch.delete(doc.ref);n++;if(n%450===0){await batch.commit();batch=db.batch();}}
        await batch.commit();
      }else{
        setStudents([]);await persist([]);
      }
      setConfirmClearDB(false);
      showSt("Base de datos eliminada.");
    }catch(e){console.error(e);showSt("No se pudo eliminar la base de datos.",true);}
  }

  function hImport(e){
    const file=e.target.files?.[0];if(!file)return;setImporting(true);
    const reader=new FileReader();
    reader.onload=async(evt)=>{try{
      const wb=XLSX.read(new Uint8Array(evt.target.result),{type:"array"});
      const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:""});
      const keyOf=(t,n,a)=>`${(t||"").trim()}|${(n||"").trim()}|${(a||"").trim()}`;
      const existing=new Set(students.filter(s=>(s.NRO_DOCUMENTO||"").trim()).map(s=>keyOf(s.TIPO_DOCUMENTO,s.NRO_DOCUMENTO,s.ANNO_INF)));
      const seen=new Set();const imported=[],rejected=[];
      rows.forEach((row,idx)=>{
        const obj=emptyStudent();Object.keys(row).forEach(k=>{const fid=FIELD_KEY_MAP[normalizeKey(k)];if(fid)obj[fid]=String(row[k]??"").trim();});
        FIELD_DEFS.forEach(f=>{if(f.type==="select"&&f.options&&obj[f.id])obj[f.id]=matchOption(obj[f.id],f.options);});
        if(!obj.ESTADO)obj.ESTADO="MATRICULADO";
        const doc=(obj.NRO_DOCUMENTO||"").trim();
        const nombre=[obj.NOMBRE1,obj.NOMBRE2,obj.APELLIDO1,obj.APELLIDO2].filter(Boolean).join(" ")||`Fila ${idx+2}`;
        if(!doc&&!obj.NOMBRE1&&!obj.APELLIDO1){rejected.push({nombre,doc:"—",razon:"Fila sin documento ni nombre"});return;}
        if(doc){const key=keyOf(obj.TIPO_DOCUMENTO,doc,obj.ANNO_INF);if(existing.has(key)){rejected.push({nombre,doc,razon:"Ya existe en la base de datos (mismo año)"});return;}if(seen.has(key)){rejected.push({nombre,doc,razon:"Duplicado dentro del archivo Excel"});return;}seen.add(key);}
        if(!obj.PIN){const auto=genPin(obj);if(auto)obj.PIN=auto;}
        obj._id=`${Date.now()}_${Math.random().toString(36).slice(2)}`;imported.push(obj);
      });
      if(imported.length){
        if(studentsCol){
          let batch=db.batch();let n=0;
          for(const obj of imported){batch.set(studentsCol.doc(obj._id),obj);n++;if(n%450===0){await batch.commit();batch=db.batch();}}
          await batch.commit();
        }else{
          const m=[...students,...imported];setStudents(m);await persist(m);
        }
      }
      setImportResult({imported:imported.length,rejected});
      showSt(imported.length?`${imported.length} importado(s). ${rejected.length} no importado(s).`:"No se importó ningún registro.",rejected.length>0&&imported.length===0);
    }catch(err){console.error(err);showSt("No se pudo leer el archivo.",true);}finally{setImporting(false);}};
    reader.onerror=()=>{setImporting(false);showSt("Error al leer el archivo.",true);};reader.readAsArrayBuffer(file);e.target.value="";
